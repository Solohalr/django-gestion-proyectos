{% extends "base.html" %}
{% block title %}Eliminar tarea · Gestor{% endblock %}

{% block content %}
<header class="mb-6">
    <h1 class="text-2xl font-semibold text-slate-900 tracking-tight">Eliminar tarea</h1>
    <p class="mt-1 text-sm text-slate-500">Esta acción no se puede deshacer.</p>
</header>

<div class="mb-6 px-4 py-3 rounded-lg bg-red-50 border border-red-200 text-sm text-red-800">
    ¿Confirmas eliminar la tarea <strong>{{ tarea.titulo }}</strong>?
</div>

<form method="post" class="flex flex-col sm:flex-row gap-3">
    {% csrf_token %}
    <a href="{% url 'proyecto_detalle' tarea.proyecto.pk %}"
       class="order-2 sm:order-1 sm:flex-1 inline-flex items-center justify-center px-4 py-2 text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-md hover:bg-slate-50 transition">
        Cancelar
    </a>
    <button type="submit"
            class="order-1 sm:order-2 sm:flex-[2] inline-flex items-center justify-center px-4 py-2 text-sm font-medium text-white bg-red-600 hover:bg-red-700 rounded-md transition">
        Sí, eliminar
    </button>
</form>
{% endblock %}
