{% extends "base.html" %}

{% block title %}Nuevo proyecto · Gestor{% endblock %}

{% block content %}
<div class="mb-6">
    <a href="{% url 'lista_proyectos' %}" class="text-sm text-gray-500 hover:text-gray-800 transition">
        ← Volver al listado
    </a>
</div>

<div class="max-w-lg">
    <div class="bg-white border border-gray-200 rounded-lg p-6 sm:p-8 shadow-sm">
        <h1 class="text-xl font-semibold text-gray-900 mb-6">Nuevo proyecto</h1>

        {% if error %}
        <div class="mb-4 px-4 py-3 rounded-md text-sm bg-red-50 text-red-800 border border-red-200">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" class="space-y-5">
            {% csrf_token %}

            <div>
                <label for="nombre" class="block text-sm font-medium text-gray-700 mb-1">
                    Nombre <span class="text-red-500">*</span>
                </label>
                <input type="text"
                       id="nombre"
                       name="nombre"
                       required
                       maxlength="100"
                       value="{{ valores.nombre|default:'' }}"
                       class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent"
                       placeholder="Nombre del proyecto">
            </div>

            <div>
                <label for="duracion" class="block text-sm font-medium text-gray-700 mb-1">
                    Duración (días) <span class="text-red-500">*</span>
                </label>
                <input type="number"
                       id="duracion"
                       name="duracion"
                       required
                       min="1"
                       value="{{ valores.duracion|default:'' }}"
                       class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent"
                       placeholder="Ej: 30">
            </div>

            <div>
                <label for="descripcion" class="block text-sm font-medium text-gray-700 mb-1">
                    Descripción
                </label>
                <textarea id="descripcion"
                          name="descripcion"
                          rows="4"
                          class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent"
                          placeholder="Descripción opcional">{{ valores.descripcion|default:'' }}</textarea>
            </div>

            <div class="flex gap-3 pt-2">
                <button type="submit"
                        class="inline-flex items-center px-4 py-2 text-sm font-medium rounded-md bg-gray-900 text-white hover:bg-gray-800 transition">
                    Guardar proyecto
                </button>
                <a href="{% url 'lista_proyectos' %}"
                   class="inline-flex items-center px-4 py-2 text-sm font-medium rounded-md border border-gray-300 text-gray-700 hover:bg-gray-50 transition">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
