{% extends "base.html" %}
{% block title %}Nueva tarea · Gestor{% endblock %}

{% block content %}
<header class="mb-6">
    <h1 class="text-2xl font-semibold text-slate-900 tracking-tight">Nueva tarea</h1>
    <p class="mt-0.5 text-sm text-slate-500">Proyecto: <span class="font-medium text-slate-700">{{ proyecto.nombre }}</span></p>
</header>

{% if error %}
<div class="mb-5 px-4 py-3 rounded-lg bg-red-50 text-red-800 border border-red-200 text-sm">
    {{ error }}
</div>
{% endif %}

<form method="post" class="space-y-5 max-w-lg">
    {% csrf_token %}

    <div>
        <label for="titulo" class="block text-sm font-medium text-slate-700 mb-1">Título *</label>
        <input type="text" name="titulo" id="titulo" required
               value="{{ valores.titulo|default:'' }}"
               placeholder="Título de la tarea"
               class="w-full px-3 py-2 rounded-md border border-slate-300 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm">
    </div>

    <div>
        <label for="descripcion" class="block text-sm font-medium text-slate-700 mb-1">Descripción</label>
        <textarea name="descripcion" id="descripcion" rows="2"
                  placeholder="Descripción opcional"
                  class="w-full px-3 py-2 rounded-md border border-slate-300 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm">{{ valores.descripcion|default:'' }}</textarea>
    </div>

    <div>
        <label for="prioridad" class="block text-sm font-medium text-slate-700 mb-1">Prioridad</label>
        <select id="prioridad" name="prioridad"
                class="w-full px-3 py-2 rounded-md border border-slate-300 text-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm">
            {% for value, label in prioridades %}
            <option value="{{ value }}"
                {% if valores.prioridad == value or not valores.prioridad and value == 'MEDIA' %}selected{% endif %}>
                {{ label }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div>
        <label for="estado" class="block text-sm font-medium text-slate-700 mb-1">Estado</label>
        <select id="estado" name="estado"
                class="w-full px-3 py-2 rounded-md border border-slate-300 text-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm">
            {% for value, label in estados %}
            <option value="{{ value }}"
                {% if valores.estado == value or not valores.estado and value == 'PENDIENTE' %}selected{% endif %}>
                {{ label }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="flex flex-col sm:flex-row gap-3 pt-1">
        <a href="{% url 'proyecto_detalle' proyecto.pk %}"
           class="order-2 sm:order-1 sm:flex-1 inline-flex items-center justify-center px-4 py-2 text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-md hover:bg-slate-50 transition">
            Cancelar
        </a>
        <button type="submit"
                class="order-1 sm:order-2 sm:flex-[2] inline-flex items-center justify-center px-4 py-2 text-sm font-medium text-white bg-brand-700 hover:bg-brand-800 rounded-md transition">
            Guardar tarea
        </button>
    </div>
</form>
{% endblock %}
