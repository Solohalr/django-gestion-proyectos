{% extends "base.html" %}

{% block title %}Nueva tarea · Gestor{% endblock %}

{% block content %}
<div class="mb-6">
    <a href="{% url 'proyecto_detalle' proyecto.pk %}" class="text-sm text-gray-500 hover:text-gray-800 transition">
        ← Volver a {{ proyecto.nombre }}
    </a>
</div>

<div class="max-w-lg">
    <div class="bg-white border border-gray-200 rounded-lg p-6 sm:p-8 shadow-sm">
        <h1 class="text-xl font-semibold text-gray-900 mb-1">Nueva tarea</h1>
        <p class="text-sm text-gray-500 mb-6">Proyecto: {{ proyecto.nombre }}</p>

        {% if error %}
        <div class="mb-4 px-4 py-3 rounded-md text-sm bg-red-50 text-red-800 border border-red-200">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" class="space-y-5">
            {% csrf_token %}

            <div>
                <label for="titulo" class="block text-sm font-medium text-gray-700 mb-1">
                    Título <span class="text-red-500">*</span>
                </label>
                <input type="text"
                       id="titulo"
                       name="titulo"
                       required
                       maxlength="200"
                       value="{{ valores.titulo|default:'' }}"
                       class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent"
                       placeholder="Título de la tarea">
            </div>

            <div>
                <label for="prioridad" class="block text-sm font-medium text-gray-700 mb-1">
                    Prioridad
                </label>
                <select id="prioridad"
                        name="prioridad"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent">
                    {% for value, label in prioridades %}
                    <option value="{{ value }}"
                        {% if valores.prioridad == value or not valores.prioridad and value == 'MEDIA' %}selected{% endif %}>
                        {{ label }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="estado" class="block text-sm font-medium text-gray-700 mb-1">
                    Estado
                </label>
                <select id="estado"
                        name="estado"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent">
                    {% for value, label in estados %}
                    <option value="{{ value }}"
                        {% if valores.estado == value or not valores.estado and value == 'PENDIENTE' %}selected{% endif %}>
                        {{ label }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="flex gap-3 pt-2">
                <button type="submit"
                        class="inline-flex items-center px-4 py-2 text-sm font-medium rounded-md bg-gray-900 text-white hover:bg-gray-800 transition">
                    Guardar tarea
                </button>
                <a href="{% url 'proyecto_detalle' proyecto.pk %}"
                   class="inline-flex items-center px-4 py-2 text-sm font-medium rounded-md border border-gray-300 text-gray-700 hover:bg-gray-50 transition">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
