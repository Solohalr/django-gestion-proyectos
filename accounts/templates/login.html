{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · Gestor de Proyectos</title>
    <link rel="shortcut icon" href="{% static 'img/favicon.ico' %}" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { font-family: 'Inter', system-ui, sans-serif; }</style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <main class="w-full max-w-sm bg-white border border-slate-200 rounded-lg shadow-sm p-8">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-slate-800 text-white mb-4 overflow-hidden">
                <img src="{% static 'img/logo.png' %}" alt="Logo" class="h-6 w-6 object-contain">
            </div>
            <h1 class="text-xl font-semibold text-slate-900">Gestor de Proyectos</h1>
            <p class="text-sm text-slate-500 mt-1">Inicia sesión para continuar</p>
        </div>

        {% if form.errors %}
        <div class="mb-5 px-3 py-2.5 rounded-md bg-red-50 text-red-700 border border-red-200 text-sm">
            Usuario o contraseña incorrectos.
        </div>
        {% endif %}

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="id_username" class="block text-sm font-medium text-slate-700 mb-1">Usuario</label>
                <input type="text" name="username" id="id_username" required autofocus
                       class="w-full px-3 py-2 rounded-md border border-slate-300 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm"
                       placeholder="Nombre de usuario">
            </div>
            <div>
                <label for="id_password" class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
                <input type="password" name="password" id="id_password" required
                       class="w-full px-3 py-2 rounded-md border border-slate-300 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm"
                       placeholder="••••••••">
            </div>
            <button type="submit"
                    class="w-full py-2.5 text-sm font-medium text-white bg-slate-800 hover:bg-slate-900 rounded-md transition">
                Ingresar
            </button>
        </form>

        <p class="mt-6 text-center text-sm text-slate-500">
            ¿No tienes cuenta?
            <a href="{% url 'registro' %}" class="font-medium text-slate-800 hover:underline">Regístrate</a>
        </p>
    </main>

</body>
</html>
